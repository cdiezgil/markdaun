# Cargo configuration for MarkDaun (src-tauri)
#
# ONNX Runtime (fastembed/ort) — Desarrollo local
# ─────────────────────────────────────────────────
# La librería estática de ONNX Runtime se pre-descarga en src-tauri/.ort/
# (excluida de git con .gitignore).
#
# Para descargarlo:
#   macOS ARM:
#     mkdir -p src-tauri/.ort
#     curl -fsSL https://parcel.pyke.io/v2/delivery/ortrs/packages/msort-binary/1.18.1/ortrs-msort_static-v1.18.1-aarch64-apple-darwin.tgz | tar -xz -C src-tauri/.ort --strip-components=1
#
# CI/CD sobreescribe ORT_LIB_LOCATION descargando la librería para cada plataforma.
#
[env]
ORT_LIB_LOCATION = { value = ".ort", relative = true }
