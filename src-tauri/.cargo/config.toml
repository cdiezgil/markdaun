#     mkdir -p src-tauri/.ort
#     curl -L https://parcel.pyke.io/v2/delivery/ortrs/packages/msort-binary/1.18.1/ortrs-msort_static-v1.18.1-aarch64-apple-darwin.tgz | tar -xz -C src-tauri/.ort --strip-components=1
#     export ORT_LIB_LOCATION="$(pwd)/src-tauri/.ort"
