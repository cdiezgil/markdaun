[package]
name = "markdaun"
version = "0.1.0"
description = "MarkDaun — WYSIWYG Markdown editor"
authors = []
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
pulldown-cmark = "0.11"
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-openssl"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", features = ["serde"] }
fastembed = "3"
ort-sys = { version = "=2.0.0-rc.4" }
sqlite-vec = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["process", "time", "rt", "io-util", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lopdf = "0.33"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
dom_smoothie = "0.18"
htmd = "0.5"
dom_query = "0.28"
sha2 = "0.10"
whisper-rs = "0.16"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "aac", "mkv", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"] }
symphonia-adapter-libopus = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
