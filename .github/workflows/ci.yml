name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Job Rust: clippy + tests ─────────────────────────────────────────────────
  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

  # ── Job Frontend: typecheck + tests + cobertura ──────────────────────────────
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest + coverage
        run: npm run test:coverage

      - name: Parse coverage summary
        if: github.event_name == 'pull_request'
        id: cov
        run: |
          node -e "
            const r = require('./coverage/coverage-summary.json');
            const t = r.total;
            const fmt = (m) => m.covered + '/' + m.total + ' (' + m.pct.toFixed(1) + '%)';
            console.log('lines=' + fmt(t.lines));
            console.log('functions=' + fmt(t.functions));
            console.log('branches=' + fmt(t.branches));
          " >> $GITHUB_OUTPUT

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vitest-coverage
          message: |
            ## 📊 Cobertura Vitest

            | Métrica    | Resultado |
            |------------|-----------|
            | Líneas     | ${{ steps.cov.outputs.lines }} |
            | Funciones  | ${{ steps.cov.outputs.functions }} |
            | Ramas      | ${{ steps.cov.outputs.branches }} |

            > Actualizado en el commit ${{ github.event.pull_request.head.sha && github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
