name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle-path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ort-url: https://parcel.pyke.io/v2/delivery/ortrs/packages/msort-binary/1.18.1/ortrs-msort_static-v1.18.1-aarch64-apple-darwin.tgz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ort-url: https://github.com/microsoft/onnxruntime/releases/download/v1.18.1/onnxruntime-win-x64-1.18.1.zip

    permissions:
      contents: write

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Download ONNX Runtime — Mac (fastembed/ort)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/.ort
          curl -fsSL -o /tmp/ort.tgz "${{ matrix.ort-url }}"
          tar -xzf /tmp/ort.tgz -C src-tauri/.ort --strip-components=1

      - name: Download ONNX Runtime — Windows (fastembed/ort)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force src-tauri\.ort | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.ort-url }}" -OutFile C:\ort.zip
          Expand-Archive -Path C:\ort.zip -DestinationPath C:\ort-unzip -Force
          $libDir = Get-ChildItem C:\ort-unzip -Recurse -Filter "onnxruntime.lib" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$libDir\*" src-tauri\.ort\

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          DATE=$(git log -1 --format='%cd' --date='format:%Y%m%d' ${{ github.event.workflow_run.head_sha }})
          SHORT=$(git rev-parse --short=7 ${{ github.event.workflow_run.head_sha }})
          echo "tag=build-${DATE}-${SHORT}" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "MarkDaun ${{ steps.tag.outputs.tag }}"
          releaseBody: "Compilación automática. Commit: ${{ github.event.workflow_run.head_sha }}"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
